AWSTemplateFormatVersion: "2010-09-09"
Description: Private image storage and an EC2 instance role for Proofly
Parameters:
  BucketName:
    Type: String
    Description: A globally unique lowercase S3 bucket name
    AllowedPattern: "[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]"
  ApplicationOrigin:
    Type: String
    Description: Exact HTTPS origin, without a trailing slash
    AllowedPattern: "https://[a-zA-Z0-9.-]+(:[0-9]+)?"
  LocalDevelopmentOrigin:
    Type: String
    Default: "http://localhost:3000"
Resources:
  Uploads:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref ApplicationOrigin, !Ref LocalDevelopmentOrigin]
            AllowedMethods: [GET, HEAD, POST]
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: ExpireStagingUploads
            Status: Enabled
            Prefix: staging/
            ExpirationInDays: 1
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
  UploadsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Uploads
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt Uploads.Arn, !Sub "${Uploads.Arn}/*"]
            Condition:
              Bool:
                aws:SecureTransport: "false"
  ApplicationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PrivateReviewImages
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["s3:GetObject", "s3:PutObject"]
                Resource:
                  - !Sub "${Uploads.Arn}/staging/*"
                  - !Sub "${Uploads.Arn}/workspaces/*"
  ApplicationInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ApplicationRole]
Outputs:
  Bucket:
    Value: !Ref Uploads
  InstanceProfile:
    Value: !Ref ApplicationInstanceProfile
  Role:
    Value: !Ref ApplicationRole
