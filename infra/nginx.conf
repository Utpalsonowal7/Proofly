# Replace proofly.example.com with your domain and provision its certificate first.
server {
    listen 80;
    listen [::]:80;
    server_name proofly.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name proofly.example.com;
    ssl_certificate /etc/letsencrypt/live/proofly.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proofly.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;
    # Review and invitation URLs are bearer capabilities; do not persist them in access logs.
    location ~ ^/(review/|join/|api/reviews/|api/invites/) {
        access_log off;
        include /etc/nginx/snippets/proofly-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/proofly-proxy.conf;
    }
}
